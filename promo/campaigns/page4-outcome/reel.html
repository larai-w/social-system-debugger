<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X向け30秒リール — その声は、結果を引き受けるか</title>
<style>
:root{--bg0:#070b14;--bg2:#0f1829;--cyan:#00d4ff;--green:#00ff88;--red:#ff2244;--ora:#ff6b2b;--yel:#ffcc00;--muted:#5a6f94;--bdr:#172340}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03060c;color:#d8e4ff;font-family:'Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.frame{position:relative;width:min(96vw,420px)}
.stage{position:relative;border:1px solid var(--bdr);border-radius:6px;background:var(--bg0);overflow:hidden}
#cv{width:100%;display:block}
.ctrl{display:flex;gap:8px;margin-top:10px;justify-content:center}
.btn{padding:7px 16px;background:var(--bg2);border:1px solid var(--bdr);border-radius:3px;color:var(--muted);font-family:inherit;font-size:.64rem;cursor:pointer;letter-spacing:.1em}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.note{margin-top:8px;font-size:.55rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="frame">
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="ctrl">
    <button class="btn" id="playBtn" onclick="togglePlay()">❚❚ PAUSE</button>
    <button class="btn" onclick="restart()">↺ RESTART</button>
  </div>
  <div class="note">X向け30秒リール（刺激的・構造批判版 / PAGE 4）— 免責フッター全編固定</div>
</div>
<script>
const CW=420, CH=740;
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
function fit(){const r=cv.parentElement.getBoundingClientRect();const s=r.width/CW;
  cv.width=CW*devicePixelRatio*s;cv.height=CH*devicePixelRatio*s;cv.style.height=(CH*s)+'px';
  cx.setTransform(devicePixelRatio*s,0,0,devicePixelRatio*s,0,0);}
addEventListener('resize',fit);fit();

// ===== timeline =====
// 0-2.6 hook / 2.6-4 card / 4-8 静 / 8-16 外部トラフィックで目的関数が希釈
// 16-17.2 beat / 17.2 結果との接続で重みづけ / 22-30 conclusion + CTA
const DUR=30;
const T_CARD=2.6,T_CALM=4,T_ALERT=8,T_SWARM=8.8,T_BEAT=16,T_FILT=17.2,T_CONC=22;
let t=0, playing=true, last=performance.now(), ended=false, shake=0;

// ===== helpers =====
function rrect(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function ss(a,b,x){const p=Math.max(0,Math.min(1,(x-a)/(b-a)));return p*p*(3-2*p);}
const inW=(a,b)=>t>=a&&t<b;
function grid(){cx.strokeStyle='rgba(0,212,255,.035)';for(let x=0;x<CW;x+=42){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,CH);cx.stroke();}for(let y=0;y<CH;y+=42){cx.beginPath();cx.moveTo(0,y);cx.lineTo(CW,y);cx.stroke();}}
function slider(x,y,w,label,lo,hi,val,col,active){
  cx.fillStyle='#5a6f94';cx.font='10px Courier New';cx.fillText(label,x,y-10);
  cx.fillStyle='#172340';rrect(x,y,w,8,4);cx.fill();
  cx.fillStyle=col;rrect(x,y,Math.max(6,w*val/100),8,4);cx.fill();
  cx.shadowBlur=active?12:5;cx.shadowColor=col;cx.fillStyle='#fff';
  cx.beginPath();cx.arc(x+w*val/100,y+4,active?8:6,0,7);cx.fill();cx.shadowBlur=0;
  cx.fillStyle='#3d4f73';cx.font='8px Courier New';
  cx.fillText(lo,x,y+20);cx.textAlign='right';cx.fillText(hi,x+w,y+20);cx.textAlign='left';
  cx.fillStyle=col;cx.font='bold 11px Courier New';cx.fillText(Math.round(val)+'%',x+w+10,y+8);}
function mini(x,y,w,label,val,col){
  cx.fillStyle='#5a6f94';cx.font='9px Courier New';cx.fillText(label,x,y-8);
  cx.fillStyle='#172340';rrect(x,y,w,6,3);cx.fill();
  cx.fillStyle=col;rrect(x,y,Math.max(4,w*val/100),6,3);cx.fill();
  cx.shadowBlur=6;cx.shadowColor=col;cx.fillStyle='#fff';
  cx.beginPath();cx.arc(x+w*val/100,y+3,5,0,7);cx.fill();cx.shadowBlur=0;
  cx.fillStyle=col;cx.font='bold 10px Courier New';cx.fillText(Math.round(val),x+w+8,y+8);}
function gauge(x,y,w,label,val,col){
  cx.fillStyle='#5a6f94';cx.font='9px Courier New';cx.fillText(label,x,y-5);
  cx.fillStyle='#172340';cx.fillRect(x,y,w,7);
  cx.fillStyle=col;cx.fillRect(x,y,w*Math.max(0,Math.min(100,val))/100,7);
  cx.fillStyle=col;cx.font='bold 10px Courier New';cx.fillText(Math.round(val),x+w+8,y+7);}
function btnUI(x,y,w,h,label,col,on){
  cx.fillStyle=on?col:'rgba(15,24,41,1)';cx.strokeStyle=col;cx.lineWidth=1.4;
  rrect(x,y,w,h,4);cx.fill();cx.stroke();
  cx.fillStyle=on?'#070b14':col;cx.font='bold 10px Courier New';cx.textAlign='center';
  cx.fillText(label,x+w/2,y+h/2+4);cx.textAlign='left';}
function stamp(text,col,scale,yy){
  cx.save();cx.translate(CW/2,yy);cx.rotate(-.08);cx.scale(scale,scale);cx.globalAlpha=Math.min(1,scale);
  cx.strokeStyle=col;cx.lineWidth=3;cx.fillStyle=col;cx.font='bold 26px Courier New';cx.textAlign='center';
  const w=cx.measureText(text).width+36;cx.strokeRect(-w/2,-26,w,42);
  cx.shadowBlur=22;cx.shadowColor=col;cx.fillText(text,0,5);cx.shadowBlur=0;
  cx.restore();cx.globalAlpha=1;cx.textAlign='left';}
function caption(text,y,col){
  cx.font='bold 12px Courier New';cx.textAlign='center';
  const w=cx.measureText(text).width+22;
  cx.fillStyle='rgba(7,11,20,.88)';rrect(CW/2-w/2,y-15,w,24,4);cx.fill();
  cx.fillStyle=col;cx.fillText(text,CW/2,y+2);cx.textAlign='left';}

// ===== ghost cursor =====
let cursor={x:CW/2,y:CH-60}, clickPulse=0, lastClickT=-1;
const KF=[];const k=(tt,x,y,c)=>KF.push({t:tt,x,y,click:!!c});
// preset 🏘当事者の広場 btn(25,96,90,26) c(70,109)
k(3.8,70,109);k(4.4,70,109,1);
// slider(40,178,280): 8%→92%
k(8.3,52+280*.08,182);k(10.6,52+280*.92,182);
// EXECUTE btn(70,612,280,30) c(210,627)
k(16.6,210,627);k(17.2,210,627,1);
function cursorAt(){
  if(t<KF[0].t){cursor.x=KF[0].x;cursor.y=KF[0].y;return;}
  for(let i=0;i<KF.length-1;i++)if(t>=KF[i].t&&t<=KF[i+1].t){
    const p=ss(KF[i].t,KF[i+1].t,t);
    cursor.x=KF[i].x+(KF[i+1].x-KF[i].x)*p;cursor.y=KF[i].y+(KF[i+1].y-KF[i].y)*p;return;}
  const L=KF[KF.length-1];cursor.x=L.x;cursor.y=L.y;}
function checkClicks(){KF.forEach(f=>{if(f.click&&t>=f.t&&lastClickT<f.t){clickPulse=1;lastClickT=f.t;
  if(Math.abs(f.t-T_FILT)<.01)shake=1;}});clickPulse=Math.max(0,clickPulse-.045);}
function drawCursor(){
  if(t<3.2||t>T_CONC-1)return;
  cx.shadowBlur=14;cx.shadowColor='#fff';cx.strokeStyle='#fff';cx.lineWidth=2;
  cx.beginPath();cx.arc(cursor.x,cursor.y,9,0,7);cx.stroke();
  cx.fillStyle='rgba(255,255,255,.85)';cx.beginPath();cx.arc(cursor.x,cursor.y,3.5,0,7);cx.fill();cx.shadowBlur=0;
  if(clickPulse>0){cx.strokeStyle=`rgba(0,212,255,${clickPulse})`;cx.beginPath();cx.arc(cursor.x,cursor.y,10+26*(1-clickPulse),0,7);cx.stroke();}}

// ===== state =====
const flood=()=>inW(T_SWARM,T_FILT), filt=()=>t>=T_FILT;
function ext(){if(t<8.3)return 8;if(t<10.6)return 8+84*ss(8.3,10.6,t);return 92;}
function game(){if(t<9.4)return 10;if(t<13)return 10+76*ss(9.4,13,t);if(t<T_FILT)return 86;return Math.max(24,86-(t-T_FILT)*28);}
function ratio(){
  if(t<T_SWARM)return 96;
  if(t<T_FILT)return Math.max(11,96-(t-T_SWARM)*12);
  return Math.min(92,11+(t-T_FILT)*24);}

// ===== packet log =====
const LOG_CALM=[['g','保育所の雨漏り、見積が届きました'],['n','バス路線の存続 — 利用データ共有'],['g','公民館の予約システム改善案'],['n','用水路の清掃当番、来月分決定']];
const LOG_SPAM=[['o','敵だ！！'],['o','祭りじゃ祭り'],['o','RT稼げるぞ'],['o','正義executed'],['o','切り抜き完了www'],['o','どっちの味方？1bitで答えろ'],['o','燃やせ燃やせ'],['o','推しを守れ！！']];
const LOG_FILT=[['c','SYBIL TRAFFIC 検出 — 遮断開始'],['c','外部スパムノード LOGOUT ×47'],['c','1ビット思考パケット DROP'],['g','当事者パケットを優先キューへ']];
const LOG_END=[['g','保育所の雨漏り — 修繕可決'],['n','次回議題: バス路線の実証実験'],['g','静かな明滅、再開']];
let log=[], logT=0, logI=0;
function pushLog(){
  const pool=t<T_ALERT?LOG_CALM:flood()?LOG_SPAM:t<20?LOG_FILT:LOG_END;
  const iv=t<T_ALERT?1.4:flood()?0.18:t<20?0.55:1.2; // 静はゆっくり、洪水はマシンガン
  logT-=0.016;
  if(logT<=0){log.push(pool[logI++%pool.length]);logT=iv;if(log.length>4)log.shift();}
}

// ===== stakeholder network =====
const locals=[];for(let i=0;i<5;i++)locals.push({a:i/5*Math.PI*2,ph:Math.random()*6});
function drawNet(){
  const bx=CW/2, by=452;
  cx.fillStyle='#5a6f94';cx.font='9px Courier New';cx.fillText('① STAKEHOLDER NETWORK — SYBIL FLOOD MONITOR',30,352);
  cx.strokeStyle='#172340';cx.fillStyle='#0f1829';
  cx.beginPath();cx.ellipse(bx,by,56,26,0,0,7);cx.fill();cx.stroke();
  // 生活者ノード: 静かな明滅（静フェーズはゆっくり呼吸、洪水中は萎縮）
  locals.forEach((l,i)=>{
    l.ph+=0.016*(flood()?1:2.2);
    const a=l.a+t*.35;
    const r=flood()?3:4.5+Math.sin(l.ph)*1.4;
    cx.shadowBlur=flood()?4:10;cx.shadowColor='#00ff88';cx.fillStyle='#00ff88';
    cx.globalAlpha=flood()?.55:1;
    cx.beginPath();cx.arc(bx+Math.cos(a)*64,by+Math.sin(a)*30,r,0,7);cx.fill();
    cx.globalAlpha=1;cx.shadowBlur=0;});
  // 外部スパムノード
  const n=Math.round(ext()/4);
  for(let i=0;i<n;i++){
    const a=i/Math.max(1,n)*Math.PI*2+t*(filt()?3:flood()?1.6:.5);
    const rr=filt()?96+(t-T_FILT)*70+i*5:flood()?96+Math.sin(t*6+i)*10:150;
    const sx=bx+Math.cos(a)*rr, sy=by+Math.sin(a)*rr*.5;
    if(sx<12||sx>CW-12||sy<362||sy>545)continue;
    cx.globalAlpha=filt()?Math.max(0,1-(t-T_FILT)*.4):(flood()?1:0);
    cx.shadowBlur=6;cx.shadowColor='#ff6b2b';cx.fillStyle='#ff6b2b';
    const s=flood()?4+Math.sin(t*10+i)*1.5:3.5;
    cx.fillRect(sx-s/2,sy-s/2,s,s);cx.shadowBlur=0;
    // 遮断されたリンク
    if(filt()){cx.strokeStyle='rgba(255,107,43,.3)';cx.setLineDash([2,4]);
      cx.beginPath();cx.moveTo(sx,sy);cx.lineTo(bx,by);cx.stroke();cx.setLineDash([]);}
    else if(flood()){cx.strokeStyle='rgba(255,107,43,.16)';
      cx.beginPath();cx.moveTo(sx,sy);cx.lineTo(bx,by);cx.stroke();}
    cx.globalAlpha=1;}
  cx.fillStyle='#3d4f73';cx.font='8px Courier New';
  cx.fillText('● 生活者ノード（静かな明滅）  ■ 外部スパムノード（1ビット思考）  --- 遮断されたリンク',36,548);
}

// ===== hook & conclusion =====
function drawHook(){
  cx.textAlign='center';
  const gl=Math.random()<.14;
  cx.fillStyle='#ff6b2b';cx.shadowBlur=20;cx.shadowColor='#ff6b2b';
  cx.font='bold 24px Courier New';
  const ox=gl?(Math.random()-.5)*8:0;
  cx.fillText('その「声」は、',CW/2+ox,CH/2-50);
  cx.fillText('結果を引き受けるか？',CW/2-ox,CH/2-14);cx.shadowBlur=0;
  if(gl){cx.fillStyle='rgba(0,212,255,.5)';cx.fillText('結果を引き受けるか？',CW/2-ox+3,CH/2-13);}
  if(t>1.3){cx.globalAlpha=ss(1.3,1.9,t);
    cx.fillStyle='#5a6f94';cx.font='11px Courier New';
    cx.fillText('声の多さだけで、街の目的が書き換わる',CW/2,CH/2+34);cx.globalAlpha=1;}
  cx.textAlign='left';
}
function drawConclusion(){
  cx.textAlign='center';
  cx.globalAlpha=ss(22.3,23,t);
  cx.fillStyle='#d8e4ff';cx.font='bold 16px Courier New';
  cx.fillText('声の大きさは、当事者性ではない。',CW/2,220);
  cx.globalAlpha=ss(23.3,24,t);
  cx.fillStyle='#00ff88';cx.shadowBlur=16;cx.shadowColor='#00ff88';cx.font='bold 18px Courier New';
  cx.fillText('結果との接続を、重みに戻す。',CW/2,276);cx.shadowBlur=0;
  if(t>24.8){const a=ss(24.8,25.6,t);cx.globalAlpha=a;
    cx.strokeStyle='#00d4ff';cx.lineWidth=1.5;rrect(CW/2-160,330,320,142,6);cx.stroke();
    cx.fillStyle='rgba(0,212,255,.05)';rrect(CW/2-160,330,320,142,6);cx.fill();
    cx.fillStyle='#00d4ff';cx.font='bold 14px Courier New';cx.shadowBlur=12;cx.shadowColor='#00d4ff';
    cx.fillText('社会デバッガー',CW/2,364);cx.shadowBlur=0;
    cx.fillStyle='#5a6f94';cx.font='9px Courier New';
    cx.fillText('無料・登録なし・ブラウザで約60秒',CW/2,386);
    cx.fillStyle='#ffcc00';cx.font='bold 10px Courier New';
    cx.fillText('声の数ではなく、構造を見る。',CW/2,414);
    cx.fillStyle='#00d4ff';cx.font='bold 9px Courier New';
    cx.fillText('larai-w.github.io/social-system-debugger/',CW/2,442);}
  if(t>27.2){cx.globalAlpha=ss(27.2,28,t);
    const bl=Math.sin(t*4)>0;cx.fillStyle=bl?'#00ff88':'rgba(0,255,136,.4)';
    cx.font='bold 12px Courier New';cx.fillText('▶ あなたなら、どの声を重くする？',CW/2,520);}
  cx.globalAlpha=1;cx.textAlign='left';
}

// ===== main page draw =====
function drawP4(){
  header();
  // presets（実アプリの4種）
  cx.fillStyle='#5a6f94';cx.font='8px Courier New';cx.fillText('PRESETS ▶',25,90);
  const alertBlink=inW(T_ALERT,T_SWARM)&&Math.sin(t*16)>0;
  btnUI(25,96,90,26,'🏘 当事者の広場','#00ff88',inW(4.4,T_ALERT));
  btnUI(120,96,90,26,'🎪 見物人の殺到','#ffcc00',false);
  btnUI(215,96,90,26,'🎮 ゲーム化進行','#ff6b2b',false);
  btnUI(310,96,86,26,'🔥 推し活炎上','#ff2244',alertBlink||flood());
  slider(40,178,280,'外部ノード流入率','当事者のみ','外部トラフィック急増',ext(),'#ff6b2b',inW(8.3,10.8));
  mini(40,236,200,'目的関数のゲーム化（自動連鎖）',game(),game()>60?'#ff2244':'#00d4ff');
  gauge(40,296,250,'真の当事者コミット比率 TRUE STAKEHOLDER RATIO',ratio(),ratio()<40?'#ff2244':'#00ff88');
  // status: 実アプリの DILUTED / GROUNDED
  cx.font='bold 9px Courier New';
  if(ratio()<40){cx.fillStyle='#ff6b2b';
    if(Math.sin(t*8)>0)cx.fillText('DILUTED — 部外者比率が上昇中',40,320);}
  else{cx.fillStyle='#00ff88';cx.fillText('GROUNDED — 当事者の声が反映されている',40,320);}
  if(flood()&&Math.sin(t*7)>0){cx.fillStyle='#ff6b2b';cx.font='bold 11px Courier New';cx.textAlign='center';
    cx.fillText('⚠ OBJECTIVE HIJACK — 目的関数乗っ取り ⚠',CW/2,338);cx.textAlign='left';}
  if(filt()&&t<T_CONC){cx.fillStyle='#00d4ff';cx.font='bold 9px Courier New';cx.textAlign='center';
    cx.fillText('▌ PACKET_FILTERING ACTIVE — SYBIL TRAFFIC BLOCKED ▐',CW/2,338);cx.textAlign='left';}
  drawNet();
  // ③ PACKET LOG
  cx.fillStyle='#5a6f94';cx.font='9px Courier New';cx.fillText('③ PACKET LOG',30,572);
  cx.strokeStyle='#172340';rrect(30,578,360,58,3);cx.stroke();
  cx.fillStyle='rgba(15,24,41,.6)';rrect(30,578,360,58,3);cx.fill();
  pushLog();
  log.forEach((L,i)=>{
    const col=L[0]==='g'?'#00ff88':L[0]==='o'?'#ff6b2b':L[0]==='c'?'#00d4ff':'#5a6f94';
    cx.fillStyle=col;cx.font=(flood()?'bold ':'')+ '9px Courier New';
    cx.fillText('> '+L[1],38,592+i*13);});
  btnUI(70,612,280,30,'▶ EXECUTE: PACKET_FILTERING','#00d4ff',filt());
  // stamps & captions
  if(inW(4.8,T_ALERT))caption('静かだが、全員が結果とつながっている',676,'#00ff88');
  if(flood()&&t>12)stamp('HIJACKED','#ff6b2b',Math.min(1,(t-12)*2.2),452);
  if(inW(12.5,T_BEAT))caption('声の多さで、街の目的が書き換わった',676,'#ff6b2b');
  if(filt()&&t>18.2)stamp('OBJECTIVE RESTORED','#00ff88',Math.min(1,(t-18.2)*2),452);
  if(inW(19,T_CONC))caption('声ではなく、結果と切れた洪水を分離した',676,'#00d4ff');
}
function header(){
  cx.fillStyle='#ff6b2b';cx.font='bold 12px Courier New';
  cx.fillText('▶ PAGE 4: STAKEHOLDER ASYMMETRY — 当事者性',20,36);
  cx.strokeStyle='#172340';cx.beginPath();cx.moveTo(20,46);cx.lineTo(CW-20,46);cx.stroke();
  cx.fillStyle='#5a6f94';cx.font='8px Courier New';cx.textAlign='right';
  cx.fillText('v6',CW-20,36);cx.textAlign='left';}

// ===== main loop =====
function step(dt){
  t+=dt;if(t>=DUR){t=DUR;ended=true;}
  if(inW(T_SWARM,T_SWARM+.5)||inW(12,12.3)||inW(15,15.3))shake=Math.max(shake,.8);
  shake=Math.max(0,shake-dt*1.8);
  cursorAt();checkClicks();
}
function render(){
  cx.save();
  if(shake>0)cx.translate((Math.random()-.5)*11*shake,(Math.random()-.5)*9*shake);
  cx.fillStyle='#070b14';cx.fillRect(-12,-12,CW+24,CH+24);grid();
  // flood vignette
  if(flood()){const g=cx.createRadialGradient(CW/2,CH/2,CH*.2,CW/2,CH/2,CH*.8);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(255,107,43,${.12*(0.6+0.4*Math.sin(t*6))})`);
    cx.fillStyle=g;cx.fillRect(0,0,CW,CH);}
  if(t<T_CARD)drawHook();
  else if(t<T_CONC){
    drawP4();
    // chapter card
    const a=Math.min(1,(t-T_CARD)*2.2)*(t<T_CARD+1.4?1:Math.max(0,1-(t-T_CARD-1.4)*2.2));
    if(a>0){cx.fillStyle=`rgba(7,11,20,${.92*a})`;cx.fillRect(0,0,CW,CH);
      cx.globalAlpha=a;cx.textAlign='center';
      cx.fillStyle='#ff6b2b';cx.font='bold 14px Courier New';cx.fillText('▶ PAGE 4',CW/2,CH/2-30);
      cx.font='bold 20px Courier New';cx.fillText('当事者性',CW/2,CH/2+2);
      cx.fillStyle='#5a6f94';cx.font='10px Courier New';cx.fillText('STAKEHOLDER ASYMMETRY',CW/2,CH/2+28);
      cx.textAlign='left';cx.globalAlpha=1;}
  }
  else drawConclusion();
  // beat flashes（メリハリ）
  if(inW(T_ALERT,T_ALERT+.18)){cx.fillStyle='rgba(255,34,68,.55)';cx.fillRect(0,0,CW,CH);
    cx.fillStyle='#fff';cx.font='bold 20px Courier New';cx.textAlign='center';
    cx.fillText('⚠ 外部トラフィック急増',CW/2,CH/2);cx.textAlign='left';}
  if(inW(T_ALERT+.35,T_ALERT+.5)){cx.fillStyle='rgba(255,34,68,.35)';cx.fillRect(0,0,CW,CH);}
  if(inW(T_BEAT,T_BEAT+.14)){cx.fillStyle='rgba(255,255,255,.7)';cx.fillRect(0,0,CW,CH);}
  if(inW(T_BEAT+.14,T_FILT)){cx.fillStyle='rgba(7,11,20,.75)';cx.fillRect(0,0,CW,CH);
    cx.fillStyle='#00d4ff';cx.font='bold 18px Courier New';cx.textAlign='center';
    cx.fillText('— 奪還プロトコル —',CW/2,CH/2);cx.textAlign='left';}
  if(inW(T_FILT,T_FILT+.14)){cx.fillStyle='rgba(0,212,255,.4)';cx.fillRect(0,0,CW,CH);}
  drawCursor();
  // 固定免責フッター（全編）
  cx.fillStyle='rgba(7,11,20,.86)';cx.fillRect(0,CH-28,CW,24);
  cx.fillStyle='#5a6f94';cx.font='8px Courier New';cx.textAlign='center';
  cx.fillText('※特定の誰かではなく、どの社会にも起こる構造の話です（架空シミュレーション）',CW/2,CH-13);
  cx.textAlign='left';
  cx.fillStyle='#172340';cx.fillRect(0,CH-4,CW,4);
  const pg=cx.createLinearGradient(0,0,CW,0);
  pg.addColorStop(0,'#00ff88');pg.addColorStop(.5,'#ff6b2b');pg.addColorStop(1,'#00d4ff');
  cx.fillStyle=pg;cx.fillRect(0,CH-4,CW*t/DUR,4);
  if(!ended){cx.fillStyle=Math.sin(t*6)>0?'#ff2244':'rgba(255,34,68,.3)';
    cx.beginPath();cx.arc(CW-26,20,4,0,7);cx.fill();
    cx.fillStyle='#5a6f94';cx.font='8px Courier New';cx.textAlign='right';cx.fillText('REC',CW-36,23);cx.textAlign='left';}
  cx.restore();
  if(ended){cx.fillStyle='#5a6f94';cx.font='10px Courier New';cx.textAlign='center';
    cx.fillText('↺ RESTART で最初から',CW/2,CH-20);cx.textAlign='left';}
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&!ended)step(dt);render();requestAnimationFrame(loop);}
function togglePlay(){playing=!playing;document.getElementById('playBtn').textContent=playing?'❚❚ PAUSE':'▶ PLAY';}
function restart(){t=0;ended=false;playing=true;shake=0;lastClickT=-1;clickPulse=0;log=[];logT=0;logI=0;
  document.getElementById('playBtn').textContent='❚❚ PAUSE';}
requestAnimationFrame(loop);
</script>
