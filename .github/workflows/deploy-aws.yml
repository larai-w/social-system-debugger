name: Deploy to AWS (S3 + CloudFront)

# The GitHub Pages deploy (deploy.yml) stays as it is; this workflow ADDS
# delivery to AWS alongside it. No long-lived access key is stored: temporary
# credentials are obtained through OIDC.
on:
  push:
    branches: [main]
    # Only run when web/ or content/ changed. An infrastructure- or docs-only
    # change does not trigger a deploy.
    paths:
      - 'web/**'
      - 'content/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

# Settings that must be configured on the GitHub repository:
#   Secrets:   AWS_DEPLOY_ROLE_ARN = the GithubDeployRoleArn output from cdk
#   Variables: AWS_REGION / S3_BUCKET(=BucketName) / CLOUDFRONT_DIST_ID(=DistributionId)

permissions:
  id-token: write # required to mint the OIDC token
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # While AWS is not configured, skip the whole job: report it as skipped
    # rather than as a red failure. It switches on by itself once the S3_BUCKET
    # variable is set.
    if: ${{ vars.S3_BUCKET != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Inject the delivery origin into web/config.js automatically; never edit
      # the source by hand. If CLOUDFRONT_DOMAIN is unset it stays at the
      # default (empty, meaning relative paths).
      - name: Inject content base URL into web/config.js
        if: ${{ vars.CLOUDFRONT_DOMAIN != '' }}
        run: |
          printf 'window.SSD_CONFIG = { contentBaseUrl: "https://%s/content/weekly", nativeContentBaseUrl: "https://%s/content/weekly" };\n' \
            "${{ vars.CLOUDFRONT_DOMAIN }}" "${{ vars.CLOUDFRONT_DOMAIN }}" > web/config.js
          echo "config.js →"; cat web/config.js

      # Sync web/. --delete clears files that are no longer needed, but
      # content/ is managed separately so it is excluded.
      - name: Sync web/
        run: |
          aws s3 sync web/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete --exclude "content/*" \
            --cache-control "public,max-age=300"

      # Sync content/ separately (the weekly scenario JSON).
      - name: Sync content/
        run: |
          aws s3 sync content/ "s3://${{ vars.S3_BUCKET }}/content/" \
            --delete --cache-control "public,max-age=300"

      # Invalidate only latest.json and index.html. Invalidating /* wastes
      # both money and time.
      - name: Invalidate latest.json + index.html
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DIST_ID }}" \
            --paths "/content/weekly/latest.json" "/index.html"
