name: CI

on:
  pull_request:
    branches: [main]
  # A PR opened by weekly-rotate comes from GITHUB_TOKEN, so it does not start
  # CI on the pull_request event (GitHub's recursion guard). The rotation
  # workflow dispatches this one explicitly so the required checks are met.
  workflow_dispatch:

jobs:
  # Frontend: engine.js unit tests plus schema validation of the weekly JSON
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check web assets exist
        run: |
          for f in web/index.html web/js/engine.js web/js/ui.js web/js/scenario.js; do
            [ -f "$f" ] || { echo "❌ missing $f"; exit 1; }
          done
          echo "✅ web assets present"

      - name: Install dev deps (eslint / prettier)
        run: npm ci

      - name: Check (tests + weekly JSON + eslint + prettier — mirrors `make check`)
        run: npm run check

  # Real-browser check: zero console output (Chart.js both working and failing,
  # 4 tabs, presets, sliders). Same script as `make verify` locally. A separate
  # job from web/infra and not a required check, so it is advisory.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Browser verification (scripts/verify.mjs)
        run: npm run verify
      # T62: verify PWA offline start on every PR (register SW, cut the network,
      # reload). The job stays advisory, as before.
      - name: Offline-start verification (scripts/verify-offline.mjs)
        run: npm run verify:offline
      # Static pages (classroom, slides, privacy, announce-cards): zero console
      # output and structure check. Advisory.
      - name: Static-pages verification (scripts/verify-pages.mjs)
        run: npm run verify:pages

  # Infrastructure: confirm cdk synth succeeds
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install infra deps
        run: npm ci
      - name: cdk synth
        run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_REGION: ap-northeast-1
