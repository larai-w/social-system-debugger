name: Dependabot auto-merge
# Patch and minor dependency updates are merged automatically once CI is green
# (all the way to main). Major updates are reviewed by hand.
# Requires: repository setting "Allow auto-merge" (allow_auto_merge=true).
#       The real gate is branch protection on main (required checks
#       `Public boundary check` and `verify`, enforced for admins too).
#       Without that protection this is not automation, it is a free pass.
#
# This merge does NOT start `deploy.yml` (GitHub Pages).
#
# A push made with GITHUB_TOKEN does not start other workflows (GitHub's
# loop-prevention rule). Auto-merge is a GITHUB_TOKEN push, so `deploy.yml`
# and its `on: push: branches: [main]` never fire, and main drifts away from
# the published page.
#
# For a dependency-only update (nothing under web/ or content/) the published
# output does not change, so there is no harm. When a dependabot PR does touch
# web/ or content/, dispatch `deploy.yml` by hand after merging. The same rule
# left carequest 33.3 hours out of step (recorded in its own
# .github/workflows/dependabot-auto-merge.yml).
#
# A PAT does not fix this; adding more long-lived keys is not the direction.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Enable auto-merge for patch/minor
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
