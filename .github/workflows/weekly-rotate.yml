name: Weekly scenario stock check

# Every Monday at 0:00 JST (Sunday 15:00 UTC), check that this week's and the
# next three weeks' content/weekly/<ISO week>.json exist.
#
# 2026-10-05: this used to copy this week's file to latest.json and push it to
# main with a deploy key. The push had been rejected by the repository rules
# since 2026-09-13, so the app stopped receiving new weeks. The app now asks
# for content/weekly/<ISO week in JST>.json directly (web/js/scenario.js
# weekIdJST), and every week's file is already deployed with the site, so no
# weekly commit is needed. latest.json stays only as a fallback.
#
# A week with no scenario in stock fails on purpose, which doubles as the
# reminder to write more scenarios (the issue step below).
on:
  schedule:
    - cron: '0 15 * * 0' # Sunday 15:00 UTC = Monday 0:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write # needed to file the issue with work instructions on failure

concurrency:
  group: weekly-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check this week and the next three weeks are in stock (JST)
        run: |
          missing=0
          for offset in 0 7 14 21; do
            WEEK_ID=$(TZ=Asia/Tokyo date -d "+${offset} days" +%G-W%V)
            if [ -f "content/weekly/${WEEK_ID}.json" ]; then
              echo "ok: ${WEEK_ID}"
            else
              echo "::error::content/weekly/${WEEK_ID}.json がありません。週替わりシナリオの在庫切れが近いです — 新しい週のJSONを追加してください。"
              missing=1
            fi
          done
          exit $missing

      # On failure - usually an empty stock, i.e. a deliberate exit 1 - file an
      # issue that says how to fix it.
      # In ITIL terms: turn an incident (a red Actions run) into a service
      # request that can be acted on as written.
      # Idempotent: if an open issue with the restock label already exists, add
      # a comment instead of filing a new one, so this does not pile up weekly.
      - name: Open a "restock" issue with a ready-to-paste prompt
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'restock';
            // This week's ISO week in JST, used in the symptom message
            const weekId = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' })
              .format(new Date()); // fallback date display; the week number is left
              // to the run log referenced in the body
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Create the restock label if it is missing. Carry on if that fails:
            // filing the issue works without a colour.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd93f0b',
                description: '週替わりシナリオの在庫補充・週次ローテ失敗のトリアージ',
              });
            } catch (e) {
              // Already exists (HTTP 422) or no permission: ignore and continue
              core.info(`ラベル作成はスキップ（既存 or 失敗）: ${e.message}`);
            }

            // Body, in Japanese: it carries a prompt that can be pasted into
            // Claude Code as-is, so it stays in the language it will be used in.
            const body = [
              '## 症状',
              `週次の在庫確認（\`Weekly scenario stock check\`）が失敗しました（実行日 JST: ${weekId}）。`,
              `今週から4週先までの \`content/weekly/<ISO週>.json\` のどれかがありません（在庫切れが近い）。`,
              '',
              `- 実行ログ: ${runUrl}`,
              '',
              '## 切り分け',
              '在庫切れ（意図的な失敗）か、それ以外（チェックアウトの失敗など）かを判定してください。',
              '手順は運用ランブック §1 を参照:',
              '[docs/operations-runbook.md#1-週次ローテが失敗した](../blob/main/docs/operations-runbook.md#1-週次ローテが失敗した)',
              '',
              '- **在庫切れ**の場合 → 下記プロンプトで次の週分を補充する（完全委任タスク）。',
              '- **それ以外**（在庫はある）→ 実行ログを見て再実行する。2026-10-05 から push はしていない（アプリが今週のファイルを直接読む）。',
              '',
              '## そのまま Claude Code に貼れるプロンプト（在庫切れ時）',
              '```',
              '次の4週分の週次シナリオ（content/weekly/<ISO週>.json）を作って。',
              '既存の週次 JSON と同じスキーマ・日英完備で、実名ゼロ・構造で語ること。',
              '受け入れは `npm run check`（週次JSONスキーマ検証＋クリア到達可能性CIを含む）を green にすること。',
              '完全委任フローと受け入れ基準は AGENTS.md「完全委任タスクの例」を参照。コミットは親が行う。',
              '```',
              '',
              '_この Issue は週次ローテ失敗時に自動起票されました。復旧後はクローズしてください。_',
            ].join('\n');

            // Idempotency check: look for an open issue with the restock label
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              // One exists: add a comment instead of filing a duplicate
              const issueNumber = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `週次の在庫確認が再度失敗しました（実行日 JST: ${weekId}）。\n\n- 実行ログ: ${runUrl}`,
              });
              core.info(`既存 Issue #${issueNumber} にコメント追記しました。`);
            } else {
              // None: file a new one
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[auto] Weekly rotation failed — restock or triage needed',
                body,
                labels: [label],
              });
              core.info(`新規 Issue #${created.data.number} を起票しました。`);
            }
