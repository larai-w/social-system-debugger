name: Weekly scenario rotation

# Every Monday at 0:00 JST (Sunday 15:00 UTC), copy that week's
# content/weekly/<ISO week>.json to latest.json and push it straight to main.
#
# How it gets through: main is protected by a ruleset (required checks
# web/infra, PR required, linear history), but this workflow pushes with a
# write deploy key (secrets.WEEKLY_ROTATE_DEPLOY_KEY) and passes through the
# ruleset's deploy-key bypass. Human changes still require a PR with green CI.
#
# Automating this through a PR was tried and proven impossible: a direct push
# with GITHUB_TOKEN is rejected, a PR opened by GITHUB_TOKEN does not start CI
# (recursion guard), and running CI on a bot's PR needs manual approval (the
# approval API is for forks only).
#
# Note: a deploy-key push does not start other workflows either, so after the
# rotation the Pages and AWS deploys are dispatched explicitly.
#
# A week with no scenario in stock fails on purpose, which doubles as the
# reminder to write more scenarios.
on:
  schedule:
    - cron: '0 15 * * 0' # Sunday 15:00 UTC = Monday 0:00 JST
  workflow_dispatch: # can also be run by hand, e.g. to publish a reworked week

permissions:
  contents: write
  actions: write # needed to dispatch the follow-up deploy workflows
  issues: write # needed to file the issue with work instructions on failure

concurrency:
  group: weekly-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out with the write deploy key: the remote becomes SSH and the
          # push passes the ruleset's deploy-key bypass. A GITHUB_TOKEN push is
          # rejected.
          ssh-key: ${{ secrets.WEEKLY_ROTATE_DEPLOY_KEY }}

      - name: Rotate latest.json to this week's scenario (JST)
        id: rotate
        run: |
          WEEK_ID=$(TZ=Asia/Tokyo date +%G-W%V)
          SRC="content/weekly/${WEEK_ID}.json"
          echo "今週: ${WEEK_ID}"
          if [ ! -f "$SRC" ]; then
            echo "::error::${SRC} がありません。週替わりシナリオの在庫切れです — 新しい週のJSONを追加してください。"
            exit 1
          fi
          if cmp -s "$SRC" content/weekly/latest.json; then
            echo "latest.json は既に ${WEEK_ID} です。何もしません。"
            echo "rotated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$SRC" content/weekly/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/weekly/latest.json
          git commit -m "content: rotate latest.json to ${WEEK_ID}"
          git push origin HEAD:main
          echo "rotated=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploys (Pages + AWS)
        if: steps.rotate.outputs.rotated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A deploy-key push does not start other workflows, so start them here.
          gh workflow run deploy.yml --ref main -R "$GH_REPO"
          # If the AWS secrets are unset, deploy-aws.yml skips itself with its own
          # if condition, which is safe.
          gh workflow run deploy-aws.yml --ref main -R "$GH_REPO"

      # On failure - usually an empty stock, i.e. a deliberate exit 1 - file an
      # issue that says how to fix it.
      # In ITIL terms: turn an incident (a red Actions run) into a service
      # request that can be acted on as written.
      # Idempotent: if an open issue with the restock label already exists, add
      # a comment instead of filing a new one, so this does not pile up weekly.
      - name: Open a "restock" issue with a ready-to-paste prompt
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'restock';
            // This week's ISO week in JST, used in the symptom message
            const weekId = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' })
              .format(new Date()); // fallback date display; the week number is left
              // to the run log referenced in the body
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Create the restock label if it is missing. Carry on if that fails:
            // filing the issue works without a colour.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd93f0b',
                description: '週替わりシナリオの在庫補充・週次ローテ失敗のトリアージ',
              });
            } catch (e) {
              // Already exists (HTTP 422) or no permission: ignore and continue
              core.info(`ラベル作成はスキップ（既存 or 失敗）: ${e.message}`);
            }

            // Body, in Japanese: it carries a prompt that can be pasted into
            // Claude Code as-is, so it stays in the language it will be used in.
            const body = [
              '## 症状',
              `週次ローテ（\`Weekly scenario rotation\`）が失敗しました（実行日 JST: ${weekId}）。`,
              `今週分の \`content/weekly/<ISO週>.json\` を \`latest.json\` へ切り替える処理が完了していません。`,
              '',
              `- 実行ログ: ${runUrl}`,
              '',
              '## 切り分け',
              '在庫切れ（意図的な失敗）か、それ以外（push/ディスパッチ等）かを判定してください。',
              '手順は運用ランブック §1 を参照:',
              '[docs/operations-runbook.md#1-週次ローテが失敗した](../blob/main/docs/operations-runbook.md#1-週次ローテが失敗した)',
              '',
              '- **在庫切れ**の場合 → 下記プロンプトで次の週分を補充する（完全委任タスク）。',
              '- **それ以外**（在庫はある）→ ランブック §1 の (B) に従う（push 競合の再実行・`actions: write` 権限・後続ワークフロー名）。',
              '',
              '## そのまま Claude Code に貼れるプロンプト（在庫切れ時）',
              '```',
              '次の4週分の週次シナリオ（content/weekly/<ISO週>.json）を作って。',
              '既存の週次 JSON と同じスキーマ・日英完備で、実名ゼロ・構造で語ること。',
              '受け入れは `npm run check`（週次JSONスキーマ検証＋クリア到達可能性CIを含む）を green にすること。',
              '完全委任フローと受け入れ基準は AGENTS.md「完全委任タスクの例」を参照。コミットは親が行う。',
              '```',
              '',
              '_この Issue は週次ローテ失敗時に自動起票されました。復旧後はクローズしてください。_',
            ].join('\n');

            // Idempotency check: look for an open issue with the restock label
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              // One exists: add a comment instead of filing a duplicate
              const issueNumber = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `週次ローテが再度失敗しました（実行日 JST: ${weekId}）。\n\n- 実行ログ: ${runUrl}`,
              });
              core.info(`既存 Issue #${issueNumber} にコメント追記しました。`);
            } else {
              // None: file a new one
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[auto] Weekly rotation failed — restock or triage needed',
                body,
                labels: [label],
              });
              core.info(`新規 Issue #${created.data.number} を起票しました。`);
            }
