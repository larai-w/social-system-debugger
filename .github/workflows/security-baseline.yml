name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 03:17 JST (Sunday 18:17 UTC)
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  public-boundary:
    name: Public boundary check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # pre-commit にしか無いガードは、フックを設定していないクローン・Web UI からの
      # 変更・別セッションの環境差を素通しする。CI にも置くことで初めて境界になる。
      - name: Check tracked files against the public-repository policy
        run: python3 scripts/check_public_repo.py --tracked
