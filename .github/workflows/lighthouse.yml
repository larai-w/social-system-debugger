# Scheduled Lighthouse audit - tracks PWA, performance and accessibility scores
# over time. Advisory, non-blocking.
#   Measures the live GitHub Pages site once a week so regressions get noticed.
#   No assert or budget is configured, so a score never fails CI (the same
#   "advisory" stance as the existing verify job).
#   Does not run on push or PR: measuring an external URL is flaky and that
#   flakiness should not enter CI.
name: Lighthouse

on:
  workflow_dispatch: # by hand: Actions -> Lighthouse -> Run workflow
  schedule:
    - cron: '0 16 * * 0' # every Monday 1:00 JST (= Sunday 16:00 UTC)

permissions:
  contents: read

jobs:
  # Measure the live Pages site and keep the report as an artifact.
  # Scores never fail the job.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lighthouse audit (performance / accessibility / best-practices / seo / pwa)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://larai-w.github.io/social-system-debugger/
          # Keep the report in Actions artifacts and temporary public storage,
          # so it can be opened and read.
          uploadArtifacts: true
          temporaryPublicStorage: true
