name: Good first issue
description: Small, safe starter tasks for first-time contributors.
title: '[Good first] '
labels:
  - good first issue
  - help wanted
body:
  - type: markdown
    attributes:
      value: |
        Use this for low-risk, beginner-safe tasks.
        Keep content within public-safe and educational boundaries.
  - type: textarea
    id: summary
    attributes:
      label: タスク要約 / Task summary
      description: What should be changed first?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 実施条件 / Acceptance criteria
      value: |
        - [ ] Scope is small and reproducible
        - [ ] Verification is added or linked
        - [ ] No private data or restricted claims are introduced
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: 見積り / Estimated effort
      placeholder: 30m
