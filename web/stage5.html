<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'self';connect-src 'none';base-uri 'none';form-action 'none'"><link rel="stylesheet" href="css/stage5.css"><title>Stage 5 · Same trigger, different scars</title>
<body><header><a href="index.html" data-ja="← 社会デバッガーへ" data-en="← Social Debugger"></a><button id="language">English</button><small>SOCIAL DEBUGGER · STAGE 5</small><h1 data-ja="同じ引き金、違う傷跡" data-en="Same trigger, different scars"></h1><p class="notice" data-ja="架空の説明用モデルです。実社会の因果・人物の責任を判定しません。回答は外部に送信せず、再読み込みで消えます。残したい場合は記録を保存してください。" data-en="An illustrative fictional model. It does not determine real-world causes or personal responsibility. Answers are not transmitted and disappear on reload. Export to keep them."></p></header>
<p id="progress" aria-live="polite"></p>
<main><section data-scene="0"><h2 tabindex="-1" data-ja="0 · 二つの社会を並べる" data-en="0 · Place two societies side by side"></h2><p data-ja="Aは確認経路が細く、Bは監査経路が細い設定から始めます。Page 1〜4とは独立した条件で比較します。条件を変更してから始めることもできます。" data-en="A starts with limited checking; B with limited auditing. This lesson uses conditions independent of Pages 1–4. You can change these conditions before starting."></p><div id="initialInputs" class="grid"></div><p data-ja="経路は0–100の架空尺度。α・βは作用者のラベルです。初期値は同じ強さですが、異なる強さも試せます。" data-en="Paths use fictional 0–100 scales. Alpha and beta label operators. Their default strengths match; unequal strengths can also be tested."></p></section>
<section data-scene="1" hidden><h2 tabindex="-1" data-ja="1 · まだショックは起きていない" data-en="1 · Before the shock"></h2><p data-ja="ショック前の出力は両方0です。それだけで安全だと判断できるでしょうか。初回はAにα、Bにβが作用します。未確認情報の拡散が大きいのはどちらか、予想してください。" data-en="Both outputs are zero before a shock. Does that establish safety? Initially alpha acts on A and beta on B. Predict which has more unverified spread."></p><p id="initialSummary"></p><label><span data-ja="予想" data-en="Prediction"></span><select id="prediction"><option value="unsure" data-ja="判断保留" data-en="Unsure"></option><option value="a">A</option><option value="b">B</option><option value="equal" data-ja="同じ" data-en="Equal"></option></select></label><label><span data-ja="理由" data-en="Reason"></span><textarea id="reason" maxlength="5000"></textarea></label><label><span data-ja="確信度（0–100）" data-en="Confidence (0–100)"></span><input id="confidence" type="number" value="50" min="0" max="100" step="1"></label></section>
<section data-scene="2" hidden><h2 tabindex="-1" data-ja="2 · 初回のショック" data-en="2 · Initial shock"></h2><p data-ja="Aにはα、Bにはβ。拡散と、監査から見えない部分を分けて読みます。静かであることと、問題が見えていることは別の指標です。" data-en="Alpha on A, beta on B. Read spread separately from what auditing misses. Quietness and visibility are distinct measures."></p><div id="original" class="table"></div></section>
<section data-scene="3" hidden><h2 tabindex="-1" data-ja="3 · 作用者を交換する" data-en="3 · Swap the operators"></h2><p data-ja="地域条件を固定し、Aにβ、Bにαを置きます。下の値は初回からの変化です。" data-en="Keep sector conditions fixed; place beta on A and alpha on B. Changes are relative to the initial run."></p><div id="swapped" class="table"></div><p id="swapCaveat" class="notice"></p></section>
<section data-scene="4" hidden><h2 tabindex="-1" data-ja="4 · 差を分解して考える" data-en="4 · Separate the sources of differences"></h2><div id="factorial" class="table"></div><p data-ja="同じαでAとBを比べると地域条件の差、同じAでαとβを比べると作用強度の差です。モデル内の比較であり、実社会の原因を特定したことにはなりません。" data-en="Compare A and B under alpha for a sector contrast; compare alpha and beta within A for an action contrast. These are within-model contrasts, not identification of real-world causes."></p><label><span data-ja="この結果のどこまでが、最初に置いた仮定から決まっていましたか？" data-en="Which parts of this result were already implied by the assumptions?"></span><textarea id="explanation" maxlength="5000"></textarea></label></section>
<section data-scene="5" hidden><h2 tabindex="-1" data-ja="5 · 一つだけ直す" data-en="5 · Repair one path"></h2><p data-ja="各地域の予算は25。介入一つに25かかり、選んだ経路を25増やします（上限100）。上限で増加幅が小さくても費用は25です。何もしない選択もできます。架空の費用で、現実の実現可能性は未評価です。" data-en="Each sector has a budget of 25. One intervention costs 25 and adds 25 to one path, capped at 100. Cost remains 25 even near the cap. Doing nothing is allowed. Costs are fictional; real-world feasibility is not evaluated."></p><div class="grid"><label>A<select id="choiceA"></select></label><label>B<select id="choiceB"></select></label></div></section>
<section data-scene="6" hidden><h2 tabindex="-1" data-ja="6 · 同じ作用で、介入前後を比べる" data-en="6 · Compare before and after repair"></h2><p data-ja="初回と同じA/α・B/βに戻し、強度も同じにします。交換後との比較ではありません。どちらの指標が変わり、何が残ったでしょうか。" data-en="Return to the initial A/alpha and B/beta pairing with unchanged strengths. This comparison is against the initial run, not the swapped run. What changed, and what remained?"></p><div id="repaired" class="table"></div><p id="cost"></p></section>
<section data-scene="7" hidden><h2 tabindex="-1" data-ja="7 · 自分の予想を振り返る" data-en="7 · Revisit your prediction"></h2><p id="predictionReview"></p><p id="reasonReview"></p><label><span data-ja="どんな観測があれば、このモデルや自分の判断を変えますか？" data-en="What observation would change this model or your judgment?"></span><textarea id="revision" maxlength="5000"></textarea></label><label><span data-ja="介護相談窓口の集約で平均待ち時間が減る見込みです。遠方住民・通信障害は未調査。判断前に調べたいことを二つ挙げてください。" data-en="Consolidating care advice desks may reduce average waiting. Remote residents and network failure are unstudied. Name two things to investigate before deciding."></span><textarea id="transfer" maxlength="5000"></textarea></label><p data-ja="これは条件を見直すための記録です。道徳的責任や政策の正解を採点していません。確認経路や監査が指標を改善する関係そのものも、このモデルの仮定です。" data-en="This record supports reconsidering conditions. It does not grade moral responsibility or policy choices. The beneficial effects of checking and auditing are themselves assumptions of this model."></p><button id="restart" data-ja="条件を変えて新しい実験" data-en="Start a new experiment"></button></section></main>
<nav aria-label="Stage navigation"><button id="back" data-ja="戻る" data-en="Back"></button><button id="next" data-ja="次へ" data-en="Next"></button></nav><footer><button id="save" data-ja="記録をJSONで保存" data-en="Export record as JSON"></button><label><span data-ja="保存した記録を読み戻す" data-en="Import saved record"></span><input type="file" id="load" accept=".json,application/json"></label><p id="status" role="status"></p><details><summary data-ja="計算式と限界" data-en="Formulas and limitations"></summary><p data-ja="拡散＝強度×(1−確認経路/100)。監査で見えない部分＝強度×(1−監査経路/100)。一時点の説明用モデルです。時間変化・復旧・住民行動は扱いません。" data-en="Spread = strength × (1 − checking/100). Unseen = strength × (1 − audit/100). This is a static illustrative model without recovery dynamics or resident behavior. "></p></details></footer><script src="js/stage5/model.js"></script><script src="js/stage5/ui.js"></script></body></html>
